name: Inspect Shared Shortcut

on:
  push:
    paths:
      - ".github/workflows/inspect-shared-shortcut.yml"

jobs:
  inspect:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Download shared shortcut
        shell: bash
        run: |
          set -euo pipefail
          ID="2b7ca0f4e562489a88f0cc9679785f7f"
          curl -fsSL "https://www.icloud.com/shortcuts/api/records/$ID" -o record.json
          python3 - <<'PY'
          import json, pathlib, urllib.request
          obj=json.load(open("record.json"))
          print("NAME:", obj.get("fields",{}).get("name",{}).get("value"))
          print("FIELDS:", sorted(obj.get("fields",{}).keys()))
          val=obj.get("fields",{}).get("shortcut",{}).get("value",{})
          print("SHORTCUT META:", {k:v for k,v in val.items() if k!="downloadURL"})
          url=val.get("downloadURL")
          if not url:
              raise SystemExit("No shortcut downloadURL")
          if "${f}" in url:
              url=url.replace("${f}","shortcut")
          print("DOWNLOAD HOST:", urllib.parse.urlparse(url).netloc)
          data=urllib.request.urlopen(url, timeout=30).read()
          pathlib.Path("shared.shortcut").write_bytes(data)
          print("BYTES:", len(data))
          PY

      - name: Decode plist
        shell: bash
        run: |
          plutil -convert xml1 -o shared.xml shared.shortcut
          python3 - <<'PY'
          import plistlib, json
          with open("shared.shortcut","rb") as f:
              p=plistlib.load(f)
          print("WORKFLOW NAME:", p.get("WFWorkflowName"))
          print("TYPES:", p.get("WFWorkflowTypes"))
          print("INPUT CLASSES:", p.get("WFWorkflowInputContentItemClasses"))
          actions=p.get("WFWorkflowActions",[])
          print("ACTION COUNT:", len(actions))
          for i,a in enumerate(actions):
              print("\nACTION",i,a.get("WFWorkflowActionIdentifier"))
              print(json.dumps(a.get("WFWorkflowActionParameters",{}),ensure_ascii=False,indent=2)[:12000])
          PY

      - name: Upload decoded shortcut
        uses: actions/upload-artifact@v4
        with:
          name: inspected-shortcut
          path: |
            record.json
            shared.xml
          retention-days: 1
