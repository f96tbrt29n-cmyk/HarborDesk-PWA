name: Full Browser Regression

on:
  push:
    branches:
      - test/full-regression-v458-cumulative-final2
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: full-browser-regression
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-regression:
    name: Full / ${{ matrix.browser }} / shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run full browser regression shard
        run: npm run test:browser:full -- --project=${{ matrix.browser }} --workers=1 --shard=${{ matrix.shard }}/4

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-${{ matrix.browser }}-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
