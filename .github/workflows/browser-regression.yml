name: Browser Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

concurrency:
  group: browser-regression-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'smoke' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run smoke browser regression
        if: github.event_name != 'workflow_dispatch' || inputs.suite == 'smoke'
        run: npm run test:browser -- --project=${{ matrix.browser }}

      - name: Run full browser regression
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
        run: npm run test:browser:full -- --project=${{ matrix.browser }} --workers=1

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
