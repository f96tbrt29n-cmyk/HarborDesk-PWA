name: Browser Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

concurrency:
  group: browser-regression-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'smoke' }}
  cancel-in-progress: true

permissions:
  contents: read

# Match the fixed local route-validation runtime; a floating major can resolve
# to different patches on different runners in the same workflow run.
env:
  HD_CI_NODE_VERSION: '24.21.0'

jobs:
  smoke:
    name: Smoke / ${{ matrix.browser }} / shard ${{ matrix.shard }} of ${{ matrix.shards }}
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'smoke'
    runs-on: ubuntu-latest
    # Match package.json exactly. Browsers and OS dependencies are baked in;
    # verify and launch them on every job instead of downloading apt packages.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble@sha256:b27e719ecbfef153e13fd24e8341736733bf2658b229677eb21ff57ff5d7fb29
      options: --user 1001 --init --ipc=host
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # C2 previously exhausted the job deadline while passing its route-heavy
          # tail. Keep native grouping, workers and deadlines; distribute all cases
          # across three jobs instead of increasing a timeout or filtering cases.
          - browser: chromium
            workers: 2
            timeout_minutes: 45
            shard: 1
            shards: 3
          - browser: chromium
            workers: 2
            timeout_minutes: 45
            shard: 2
            shards: 3
          - browser: chromium
            workers: 2
            timeout_minutes: 45
            shard: 3
            shards: 3
          - browser: webkit
            workers: 1
            timeout_minutes: 45
            shard: 1
            shards: 4
          - browser: webkit
            workers: 1
            timeout_minutes: 45
            shard: 2
            shards: 4
          - browser: webkit
            workers: 1
            timeout_minutes: 45
            shard: 3
            shards: 4
          - browser: webkit
            workers: 1
            timeout_minutes: 45
            shard: 4
            shards: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.HD_CI_NODE_VERSION }}

      - name: Install test dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Verify service worker cache lifetime, registration readiness and storage diagnostics
        run: node --test tests/five-three-branches.test.cjs tests/conditional-speed-ui.test.cjs tests/scouting-options.test.cjs tests/scouting-evidence.test.cjs tests/north-drum-oracle.test.cjs tests/submarine-storage-comparison.test.cjs tests/pwa-prepared-storage.test.cjs tests/hash-navigation-audit.test.cjs tests/version-call-probe.test.cjs tests/workspace-stale-scroll.test.cjs tests/response-storage-headers.test.cjs tests/toast-action-retry.test.cjs tests/sw-cache-lifetime.test.cjs tests/module-loader-recovery.test.cjs tests/planner-storage-read.test.cjs tests/storage-null-capture.test.cjs tests/pwa-registration-ready.test.cjs tests/pwa-initial-registration-ready.test.cjs tests/pwa-registration-continuation.test.cjs tests/registration-route-fixture.test.cjs tests/initial-update-fixture.test.cjs tests/initial-document-fixture.test.cjs tests/normal-version-route-fixture.test.cjs tests/pwa-storage-audit.test.cjs tests/ci-smoke-tools.test.cjs tests/three-two-radar-guidance.test.cjs tests/three-two-finite-placement.test.cjs tests/finite-los-placement.test.cjs tests/upper-central-scouting-guidance.test.cjs tests/two-area-finite-carrier.test.cjs tests/one-area-finite-carrier.test.cjs

      - name: Verify and launch bundled Playwright browser
        run: node tests/ci-browser-environment.cjs ${{ matrix.browser }}

      - name: Run smoke browser regression
        shell: bash
        env:
          HD_CI_BROWSER: ${{ matrix.browser }}
          HD_CI_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.browser }}" == "webkit" ]]; then
            # Only the file partition changes. Keep all serial groups in their
            # file and replace the shell with the unmodified native test runner.
            node tests/ci-smoke-shards.cjs --shard=${{ matrix.shard }}/${{ matrix.shards }} > "$RUNNER_TEMP/harbordesk-webkit-selected-files.txt"
            mapfile -t smoke_files < "$RUNNER_TEMP/harbordesk-webkit-selected-files.txt"
            test "${#smoke_files[@]}" -gt 0
            exec node node_modules/playwright/cli.js test "${smoke_files[@]}" --config=playwright.ci.config.cjs --project=webkit --workers=${{ matrix.workers }}
          fi
          exec npm run test:browser -- --config=playwright.ci.config.cjs --project=${{ matrix.browser }} --workers=${{ matrix.workers }} --shard=${{ matrix.shard }}/${{ matrix.shards }}

      # Small lifecycle results and current-batch metadata are available before
      # the unchanged large diagnostics uploads, including after cancellation.
      - name: Preserve compact smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/harbordesk-ci-smoke/
            test-results/optional-anti-air-hints-*/optional-aa-ui-summary.json
            test-results/owned-equipment-planner-*/carrier-placement-ui-summary.json
            test-results/owned-equipment-planner-*/surface-night-placement-ui-summary.json
            test-results/owned-equipment-planner-*/soft-land-remedy-ui-summary.json
            test-results/owned-equipment-planner-*/scouting-optional-ui-summary.json
            test-results/owned-equipment-planner-*/optional-asw-destination-ui-summary.json
            test-results/owned-equipment-planner-*/air-count-optional-ui-summary.json
            test-results/owned-equipment-planner-*/two-area-carrier-ui-summary.json
            test-results/owned-equipment-planner-*/two-area-air-count-ui-summary.json
            test-results/owned-equipment-planner-*/starter-selection-ui-summary.json
            test-results/owned-equipment-planner-*/three-two-radar-count-ui-summary.json
            test-results/owned-equipment-planner-*/upper-central-scouting-ui-summary.json
            test-results/owned-equipment-planner-*/finite-carrier-allocation-ui-summary.json
            test-results/owned-equipment-planner-*/starter-finite-carrier-ui-summary.json
            test-results/owned-equipment-planner-*/finite-carrier-gap-ui-summary.json
            test-results/owned-equipment-planner-*/three-two-finite-ui-summary.json
            test-results/owned-equipment-planner-*/finite-los-ui-summary.json
            test-results/night-policy-reload-*/carrier-post-load-storage-comparison.json
          if-no-files-found: warn
          retention-days: 14

      # New producer metadata only; original raw evidence remains in its existing archive.
      - name: Preserve seven-three first-gauge comparison summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-summary-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/route-one-five-middle-*/route-guidance-summary.json
            test-results/route-one-five-bbv-cl-*/route-guidance-summary.json
            test-results/route-one-five-bbv-cl2-*/route-guidance-summary.json
            test-results/route-one-five-cl2-dd2-*/route-guidance-summary.json
            test-results/route-one-five-cl1-dd3-*/route-guidance-summary.json
            test-results/route-two-five-ceio-*/route-guidance-summary.json
            test-results/route-three-one-cfg-*/route-guidance-summary.json
            test-results/route-seven-three-first-*/route-guidance-summary.json
            test-results/route-seven-four-*/route-guidance-summary.json
            test-results/route-seven-five-first-*/route-guidance-summary.json
            test-results/route-seven-five-second-*/route-guidance-summary.json
            test-results/route-seven-five-third-*/route-guidance-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.browser }}-shard-${{ matrix.shard }}-of-${{ matrix.shards }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      # A successful retry makes failure() false. Preserve files from failed
      # attempts as well as any retry trace without uploading every passing report.
      - name: Preserve failed-attempt diagnostics after successful retries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attempt-diagnostics-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/**/test-failed-*.png
            test-results/**/video.webm
            test-results/**/trace.zip
            test-results/**/error-context.md
            test-results/**/reload-navigation-evidence.json
            test-results/**/pwa-storage-audit.json
            test-results/**/pre-reload-storage-presence.json
            test-results/**/post-load-storage-verification.json
            test-results/**/sync-version-response.json
            test-results/**/sync-write-failure.json
            test-results/**/north-drum-domain.json
            test-results/**/north-los-ui.json
            test-results/**/air-target-evidence.json
            test-results/**/route-guidance-evidence.json
            test-results/**/sortie-compatibility-evidence.json
            test-results/**/pwa-registration-state.json
            test-results/**/pwa-registration-continuation.json
            test-results/**/registration-route-result.json
            test-results/**/hash-navigation-audit.json
            test-results/**/hash-workspace-*.js
            test-results/module-loader-*/
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve prerequisite import evidence including successful retries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerequisite-import-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/harbordesk-ci-browser-environment/
            test-results/strategy-import-diagnostics/
            test-results/guided-ship-acquisition-*share-one-completion-state-*/
            test-results/guided-ship-acquisition-*issions-item-and-completion-*/
            test-results/strategy-upstream-render-*/
          if-no-files-found: ignore
          retention-days: 14

  full:
    name: Full / ${{ matrix.browser }} / shard ${{ matrix.shard }}
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble@sha256:b27e719ecbfef153e13fd24e8341736733bf2658b229677eb21ff57ff5d7fb29
      options: --user 1001 --init --ipc=host
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.HD_CI_NODE_VERSION }}

      - name: Install test dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Verify and launch bundled Playwright browser
        run: node tests/ci-browser-environment.cjs ${{ matrix.browser }}

      - name: Run full browser regression shard
        run: npm run test:browser:full -- --project=${{ matrix.browser }} --workers=1 --shard=${{ matrix.shard }}/4

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.browser }}-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve runtime environment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-full-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/harbordesk-ci-browser-environment/
          if-no-files-found: ignore
          retention-days: 14
