name: Read completed CI154 job summaries
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read six completed job logs and emit summaries only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYLOG'
          import subprocess,re,json
          for job in [116525599747,116525599763,116525599764,116525599830,116525599880,116525599912]:
              r=subprocess.run(['gh','api','--allow-escape-sequences',f'repos/f96tbrt29n-cmyk/HarborDesk-PWA/actions/jobs/{job}/logs'],capture_output=True,text=True)
              if r.returncode:
                  raise SystemExit(f'Log retrieval failed for job {job}; no counts inferred')
              lines=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',r.stdout).splitlines()
              selected=[x for x in lines if re.search(r'\b\d+ (passed|flaky|failed|skipped)\b|\(retry #\d+\)',x)]
              if not any(re.search(r'\b\d+ passed\b',x) for x in selected):
                  raise SystemExit(f'Playwright pass summary absent for job {job}; no counts inferred')
              text=json.dumps({'job':job,'lines':selected[-40:]},ensure_ascii=False)
              text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=CI154 job summary::'+text)
          PYLOG
