name: Read CI153 job summary
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read completed Chromium job log and emit summary only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/f96tbrt29n-cmyk/HarborDesk-PWA/actions/jobs/116318587127/logs > "$RUNNER_TEMP/ci153-job.log"
          python - "$RUNNER_TEMP/ci153-job.log" <<'PY'
          import pathlib,re,sys,json
          lines=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',pathlib.Path(sys.argv[1]).read_text()).splitlines()
          selected=[x for x in lines if re.search(r'\b\d+ (passed|flaky|failed|skipped)\b|\(retry #\d+\)',x)]
          if not any(re.search(r'\b\d+ passed\b',x) for x in selected):
              raise SystemExit('Playwright pass summary not found; do not infer first-pass counts')
          text=json.dumps({'job':116318587127,'lines':selected[-40:]},ensure_ascii=False)
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=CI153 Chromium shard1 summary::'+text)
          PY
