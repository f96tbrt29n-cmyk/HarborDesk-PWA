name: Browser Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

concurrency:
  group: browser-regression-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'smoke' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke / ${{ matrix.browser }} / shard ${{ matrix.shard }} of ${{ matrix.shards }}
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            workers: 2
            timeout_minutes: 45
            shard: 1
            shards: 2
          - browser: chromium
            workers: 2
            timeout_minutes: 45
            shard: 2
            shards: 2
          - browser: webkit
            workers: 1
            timeout_minutes: 45
            shard: 1
            shards: 4
          - browser: webkit
            workers: 1
            timeout_minutes: 45
            shard: 2
            shards: 4
          - browser: webkit
            workers: 1
            timeout_minutes: 45
            shard: 3
            shards: 4
          - browser: webkit
            workers: 1
            timeout_minutes: 45
            shard: 4
            shards: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Verify service worker cache lifetime, registration readiness and storage diagnostics
        run: node --test tests/sw-cache-lifetime.test.cjs tests/pwa-registration-ready.test.cjs tests/pwa-initial-registration-ready.test.cjs tests/pwa-registration-continuation.test.cjs tests/registration-route-fixture.test.cjs tests/initial-update-fixture.test.cjs tests/initial-document-fixture.test.cjs tests/pwa-storage-audit.test.cjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run smoke browser regression
        run: npm run test:browser -- --project=${{ matrix.browser }} --workers=${{ matrix.workers }} --shard=${{ matrix.shard }}/${{ matrix.shards }}

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.browser }}-shard-${{ matrix.shard }}-of-${{ matrix.shards }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      # A successful retry makes failure() false. Preserve files from failed
      # attempts as well as any retry trace without uploading every passing report.
      - name: Preserve failed-attempt diagnostics after successful retries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attempt-diagnostics-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/**/test-failed-*.png
            test-results/**/video.webm
            test-results/**/trace.zip
            test-results/**/error-context.md
            test-results/**/reload-navigation-evidence.json
            test-results/**/pwa-storage-audit.json
            test-results/**/sync-version-response.json
            test-results/**/pwa-registration-state.json
            test-results/**/pwa-registration-continuation.json
            test-results/**/registration-route-result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve prerequisite import evidence including successful retries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerequisite-import-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/strategy-import-diagnostics/
            test-results/guided-ship-acquisition-*share-one-completion-state-*/
            test-results/guided-ship-acquisition-*issions-item-and-completion-*/
            test-results/strategy-upstream-render-*/
          if-no-files-found: ignore
          retention-days: 14

  full:
    name: Full / ${{ matrix.browser }} / shard ${{ matrix.shard }}
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run full browser regression shard
        run: npm run test:browser:full -- --project=${{ matrix.browser }} --workers=1 --shard=${{ matrix.shard }}/4

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.browser }}-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
