name: Deploy HarborDesk PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: harbordesk-pages-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate HarborDesk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Validate PWA metadata and cached assets
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['app-version.json','manifest.webmanifest']){
            JSON.parse(fs.readFileSync(file,'utf8'));
            console.log(`OK JSON: ${file}`);
          }
          const sw=fs.readFileSync('sw.js','utf8');
          const block=sw.match(/const ASSETS=\[(.*?)\];/s);
          if(!block)throw new Error('sw.js ASSETS list not found');
          const assets=[...block[1].matchAll(/'([^']+)'/g)].map(m=>m[1]);
          const missing=[];
          for(const asset of assets){
            const path=asset.replace(/^\.\//,'');
            if(!fs.existsSync(path))missing.push(asset);
          }
          if(missing.length)throw new Error(`Missing cached assets: ${missing.join(', ')}`);
          console.log(`OK cached assets: ${assets.length}`);
          const version=JSON.parse(fs.readFileSync('app-version.json','utf8'));
          const update=fs.readFileSync('update-manager.js','utf8');
          const updateVersion=update.match(/const HD_APP_VERSION='([^']+)'/)?.[1];
          const updateBuild=Number(update.match(/const HD_APP_BUILD=(\d+)/)?.[1]);
          const cacheBuild=Number(sw.match(/const CACHE='harbordesk-pwa-v(\d+)'/)?.[1]);
          if(version.version!==updateVersion||Number(version.build)!==updateBuild||Number(version.build)!==cacheBuild){
            throw new Error(`Version mismatch: app-version=${version.version}/${version.build}, update-manager=${updateVersion}/${updateBuild}, sw=v${cacheBuild}`);
          }
          const cacheSet=new Set(assets.map(x=>x.replace(/^\.\//,'')));
          const runtimeFiles=fs.readdirSync('.').filter(f=>fs.statSync(f).isFile()&&(f.endsWith('.js')||f.endsWith('.css'))&&f!=='sw.js'&&f!=='playwright.config.js');
          const uncached=runtimeFiles.filter(f=>!cacheSet.has(f));
          if(uncached.length)throw new Error(`Runtime assets missing from SW cache: ${uncached.join(', ')}`);
          console.log(`OK version alignment: v${version.version} build ${version.build}`);
          console.log(`OK runtime assets cached: ${runtimeFiles.length}`);
          NODE

      - name: Validate runtime asset graph
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sources=['index.html','update-manager.js','quick-nav.js'].map(f=>fs.readFileSync(f,'utf8')).join('\n');
          const top=fs.readdirSync('.').filter(f=>fs.statSync(f).isFile());
          const orphanJs=top.filter(f=>f.endsWith('.js')&&f!=='sw.js'&&f!=='playwright.config.js'&&!sources.includes(f));
          const orphanCss=top.filter(f=>f.endsWith('.css')&&!sources.includes(f));
          if(orphanJs.length||orphanCss.length){
            throw new Error('Unconnected runtime assets: '+[...orphanJs,...orphanCss].join(', '));
          }
          console.log('OK runtime JS/CSS graph');
          NODE

      - name: Validate ship image source
        run: node --test tests/ship-image-source.test.cjs

      - name: Validate Kancolle master semantics
        run: node scripts/validate-kancolle-master.mjs

  browser:
    name: Playwright / ${{ matrix.browser }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run browser regression tests
        run: npm run test:browser -- --project=${{ matrix.browser }}

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy Pages
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
