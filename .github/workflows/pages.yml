name: Deploy HarborDesk PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Validate PWA metadata and cached assets
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['app-version.json','manifest.webmanifest']){
            JSON.parse(fs.readFileSync(file,'utf8'));
            console.log(`OK JSON: ${file}`);
          }
          const sw=fs.readFileSync('sw.js','utf8');
          const block=sw.match(/const ASSETS=\[(.*?)\];/s);
          if(!block)throw new Error('sw.js ASSETS list not found');
          const assets=[...block[1].matchAll(/'([^']+)'/g)].map(m=>m[1]);
          const missing=[];
          for(const asset of assets){
            const path=asset.replace(/^\.\//,'');
            if(!fs.existsSync(path))missing.push(asset);
          }
          if(missing.length)throw new Error(`Missing cached assets: ${missing.join(', ')}`);
          console.log(`OK cached assets: ${assets.length}`);
          NODE

      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Runtime smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/harbordesk-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          npx playwright test tests --reporter=line

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
