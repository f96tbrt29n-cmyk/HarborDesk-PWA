name: Targeted v458 WebKit Fleet Suggester

on:
  push:
    branches:
      - test/v458-fleet-suggester-webkit

permissions:
  contents: read

jobs:
  targeted-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Repeat sparse-inventory open regression
        run: npx playwright test tests/fleet-loadout-planner.spec.js --project=webkit --workers=1 --grep "sparse inventory is shown as unfilled loadout slots instead of invented gear" --repeat-each=5 --retries=0
