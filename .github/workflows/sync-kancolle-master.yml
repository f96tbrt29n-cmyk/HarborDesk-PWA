name: Sync Kancolle master

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: write

concurrency:
  group: sync-kancolle-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate master snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-kancolle-master.mjs --write
      - name: Validate generated JavaScript
        run: node --check ship-master-snapshot.js
      - name: Commit if master changed
        shell: bash
        run: |
          if git diff --quiet -- ship-master-snapshot.js; then
            echo "No master changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ship-master-snapshot.js
          git commit -m "Sync Kancolle master snapshot"
          git push
