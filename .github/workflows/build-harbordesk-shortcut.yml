name: Build HarborDesk Shortcut

on:
  push:
    paths:
      - ".github/workflows/build-harbordesk-shortcut.yml"

permissions:
  contents: write

jobs:
  build-shortcut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production shortcut from shared template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build downloads
          python3 - <<'PY'
          import json, pathlib, plistlib, urllib.request
          shortcut_id="2b7ca0f4e562489a88f0cc9679785f7f"
          with urllib.request.urlopen(f"https://www.icloud.com/shortcuts/api/records/{shortcut_id}",timeout=30) as r:
              rec=json.load(r)
          url=rec["fields"]["shortcut"]["value"]["downloadURL"]
          if "${f}" in url:
              url=url.replace("${f}","shortcut")
          with urllib.request.urlopen(url,timeout=30) as r:
              raw=r.read()
          p=plistlib.loads(raw)
          actions=p.get("WFWorkflowActions",[])
          if len(actions)!=1 or actions[0].get("WFWorkflowActionIdentifier")!="is.workflow.actions.runjavascriptonwebpage":
              raise SystemExit("Unexpected shared shortcut structure")
          p["WFWorkflowName"]="HarborDeskキャプチャ"
          p["WFWorkflowTypes"]=["ActionExtension"]
          p["WFWorkflowInputContentItemClasses"]=["WFSafariWebPageContentItem"]
          p["WFWorkflowHasShortcutInputVariables"]=True
          p["WFWorkflowImportQuestions"]=[]
          p["WFWorkflowOutputContentItemClasses"]=[]
          p["WFWorkflowMinimumClientVersion"]=1100
          p["WFWorkflowMinimumClientVersionString"]="1100"
          with open("build/HarborDesk-Capture.xml","wb") as f:
              plistlib.dump(p,f,fmt=plistlib.FMT_XML,sort_keys=False)
          print("production actions",len(actions),"js chars",len(actions[0].get("WFWorkflowActionParameters",{}).get("WFJavaScript","")))
          PY

      - name: Build diagnostic shortcuts
        shell: bash
        run: |
          python3 - <<'PY'
          import plistlib
          js="""try{
            var d=document.getElementById('hd-kc-shortcut-test');
            if(d)d.remove();
            d=document.createElement('div');
            d.id='hd-kc-shortcut-test';
            d.textContent='HarborDesk ショートカット実行OK';
            d.style.cssText='position:fixed;z-index:2147483647;left:12px;right:12px;top:12px;padding:16px;border-radius:12px;background:#0b2235;color:#fff;border:2px solid #74d4ff;font:700 16px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center';
            (document.documentElement||document.body).appendChild(d);
            completion('HarborDesk診断OK: '+location.href)
          }catch(e){completion('HarborDesk診断エラー: '+String(e&&e.message||e))}"""
          common={
            "WFWorkflowClientVersion":"4000.0",
            "WFWorkflowHasOutputFallback":False,
            "WFWorkflowHasShortcutInputVariables":True,
            "WFWorkflowIcon":{"WFWorkflowIconGlyphNumber":59511,"WFWorkflowIconStartColor":4282601983},
            "WFWorkflowImportQuestions":[],
            "WFWorkflowInputContentItemClasses":["WFSafariWebPageContentItem"],
            "WFWorkflowMinimumClientVersion":1100,
            "WFWorkflowMinimumClientVersionString":"1100",
            "WFWorkflowOutputContentItemClasses":[],
            "WFWorkflowTypes":["ActionExtension"]
          }
          test=dict(common)
          test["WFWorkflowName"]="HarborDesk診断"
          test["WFWorkflowActions"]=[{
              "WFWorkflowActionIdentifier":"is.workflow.actions.runjavascriptonwebpage",
              "WFWorkflowActionParameters":{"WFJavaScript":js}
          }]
          with open("build/HarborDesk-Test.xml","wb") as f:
              plistlib.dump(test,f,fmt=plistlib.FMT_XML,sort_keys=False)

          debug=dict(common)
          debug["WFWorkflowName"]="HarborDesk診断2"
          debug["WFWorkflowActions"]=[
            {
              "WFWorkflowActionIdentifier":"is.workflow.actions.alert",
              "WFWorkflowActionParameters":{
                "WFAlertActionCancelButtonShown":False,
                "WFAlertActionTitle":"HarborDesk",
                "WFAlertActionMessage":"① ショートカット開始：ここまでOK"
              }
            },
            {
              "WFWorkflowActionIdentifier":"is.workflow.actions.runjavascriptonwebpage",
              "WFWorkflowActionParameters":{"WFJavaScript":js}
            },
            {
              "WFWorkflowActionIdentifier":"is.workflow.actions.alert",
              "WFWorkflowActionParameters":{
                "WFAlertActionCancelButtonShown":False,
                "WFAlertActionTitle":"HarborDesk",
                "WFAlertActionMessage":"③ JavaScript完了：ここまでOK"
              }
            }
          ]
          with open("build/HarborDesk-Debug.xml","wb") as f:
              plistlib.dump(debug,f,fmt=plistlib.FMT_XML,sort_keys=False)
          PY

      - name: Sign shortcuts through HubSign
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request
          for stem,name in [("HarborDesk-Capture","HarborDeskキャプチャ"),("HarborDesk-Test","HarborDesk診断"),("HarborDesk-Debug","HarborDesk診断2")]:
              xml=pathlib.Path(f"build/{stem}.xml").read_text()
              body=json.dumps({"shortcutName":name,"shortcut":xml},ensure_ascii=False).encode()
              req=urllib.request.Request(
                  "https://hubsign.routinehub.services/sign",
                  data=body,
                  headers={"Content-Type":"application/json","User-Agent":"cherri/0.2.7-beta"},
                  method="POST"
              )
              with urllib.request.urlopen(req,timeout=60) as res:
                  data=res.read()
                  print(stem,"STATUS",res.status,"BYTES",len(data),"MAGIC",data[:4])
              if data[:4] != b"AEA1":
                  raise SystemExit(f"{stem}: HubSign response is not AEA1")
              pathlib.Path(f"downloads/{stem}.shortcut").write_bytes(data)
          PY
          test -s downloads/HarborDesk-Capture.shortcut
          test -s downloads/HarborDesk-Test.shortcut
          test -s downloads/HarborDesk-Debug.shortcut
          xxd -l 8 downloads/HarborDesk-Capture.shortcut
          xxd -l 8 downloads/HarborDesk-Test.shortcut
          xxd -l 8 downloads/HarborDesk-Debug.shortcut

      - name: Publish signed shortcut files
        shell: bash
        run: |
          git config user.name "HarborDesk Actions"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/HarborDesk-Capture.shortcut downloads/HarborDesk-Test.shortcut downloads/HarborDesk-Debug.shortcut
          if git diff --cached --quiet; then
            echo "No shortcut binary change"
          else
            git commit -m "Publish signed HarborDesk shortcuts"
            git push
          fi

      - name: Upload signed shortcuts
        uses: actions/upload-artifact@v4
        with:
          name: HarborDesk-Shortcuts
          path: |
            downloads/HarborDesk-Capture.shortcut
            downloads/HarborDesk-Test.shortcut
            downloads/HarborDesk-Debug.shortcut
          if-no-files-found: error
          retention-days: 14
