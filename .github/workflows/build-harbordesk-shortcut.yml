name: Build HarborDesk Shortcut

on:
  push:
    paths:
      - ".github/workflows/build-harbordesk-shortcut.yml"

permissions:
  contents: write

jobs:
  build-shortcut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate shortcut plist
        shell: bash
        run: |
          mkdir -p build downloads
          python3 - <<'PY'
          import plistlib, pathlib
          js = """try{
            var d=document.getElementById('hd-kc-shortcut-test');
            if(d)d.remove();
            d=document.createElement('div');
            d.id='hd-kc-shortcut-test';
            d.textContent='HarborDesk ショートカット実行OK';
            d.style.cssText='position:fixed;z-index:2147483647;left:12px;right:12px;top:12px;padding:16px;border-radius:12px;background:#0b2235;color:#fff;border:2px solid #74d4ff;font:700 16px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center';
            (document.documentElement||document.body).appendChild(d);
            completion('HarborDesk診断OK: '+location.href)
          }catch(e){
            completion('HarborDesk診断エラー: '+String(e&&e.message||e))
          }"""
          workflow = {
              "WFWorkflowActions": [{
                  "WFWorkflowActionIdentifier": "is.workflow.actions.runjavascriptonwebpage",
                  "WFWorkflowActionParameters": {"WFJavaScript": js}
              }],
              "WFWorkflowClientVersion": "4000.0",
              "WFWorkflowHasOutputFallback": False,
              "WFWorkflowHasShortcutInputVariables": True,
              "WFWorkflowIcon": {
                  "WFWorkflowIconGlyphNumber": 59511,
                  "WFWorkflowIconStartColor": 4282601983
              },
              "WFWorkflowImportQuestions": [],
              "WFWorkflowInputContentItemClasses": ["WFSafariWebPageContentItem"],
              "WFWorkflowMinimumClientVersion": 1100,
              "WFWorkflowMinimumClientVersionString": "1100",
              "WFWorkflowName": "HarborDeskキャプチャ",
              "WFWorkflowOutputContentItemClasses": [],
              "WFWorkflowTypes": ["ActionExtension"]
          }
          with open("build/HarborDesk-Capture.xml","wb") as f:
              plistlib.dump(workflow,f,fmt=plistlib.FMT_XML,sort_keys=False)
          print(pathlib.Path("build/HarborDesk-Capture.xml").read_text())
          PY

      - name: Sign through HubSign
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request
          xml=pathlib.Path("build/HarborDesk-Capture.xml").read_text()
          body=json.dumps({"shortcutName":"HarborDeskキャプチャ","shortcut":xml},ensure_ascii=False).encode()
          req=urllib.request.Request(
              "https://hubsign.routinehub.services/sign",
              data=body,
              headers={
                  "Content-Type":"application/json",
                  "User-Agent":"cherri/0.2.7-beta"
              },
              method="POST"
          )
          with urllib.request.urlopen(req,timeout=60) as res:
              data=res.read()
              print("STATUS",res.status,"BYTES",len(data),"MAGIC",data[:4])
          if data[:4] != b"AEA1":
              raise SystemExit("HubSign response is not an AEA1 signed shortcut")
          pathlib.Path("downloads/HarborDesk-Capture.shortcut").write_bytes(data)
          PY
          test -s downloads/HarborDesk-Capture.shortcut
          xxd -l 16 downloads/HarborDesk-Capture.shortcut

      - name: Publish signed shortcut file
        shell: bash
        run: |
          git config user.name "HarborDesk Actions"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/HarborDesk-Capture.shortcut
          if git diff --cached --quiet; then
            echo "No shortcut binary change"
          else
            git commit -m "Publish signed HarborDesk shortcut"
            git push
          fi

      - name: Upload signed shortcut artifact
        uses: actions/upload-artifact@v4
        with:
          name: HarborDesk-Capture
          path: downloads/HarborDesk-Capture.shortcut
          if-no-files-found: error
          retention-days: 14
