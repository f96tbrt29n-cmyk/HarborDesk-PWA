<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071521">
<title>HarborDesk ショートカット</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#071521;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 18px 40px}
.card{background:#0c1d2b;border:1px solid #274158;border-radius:18px;padding:18px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
h1{font-size:24px;margin:0 0 8px}p{color:#b8ccdc;line-height:1.65}
button,a.btn{display:block;width:100%;box-sizing:border-box;text-decoration:none;text-align:center;margin:12px 0 0;padding:15px 14px;border-radius:13px;font-weight:700;border:0;font-size:16px;background:#dcecff;color:#071521}
button.sub,a.sub{background:#152b3d;color:#dcecff;border:1px solid #38546c}
.small{font-size:12px;color:#91aabd;margin-top:15px}
#status{margin-top:12px;padding:10px 12px;border-radius:10px;background:#08131d;color:#b8ccdc;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<div class="card">
<h1>HarborDeskキャプチャ</h1>
<p>Safariの共有シートから艦これページ上で実行する、署名済みのHarborDesk用ショートカット。</p>

<button id="downloadMain">HarborDeskキャプチャを保存</button>
<button id="downloadTest" class="sub">診断版を保存</button>

<div id="status"></div>

<p class="small">
保存後は「ファイル」アプリ → ダウンロード → <b>HarborDesk-Capture.shortcut</b> をタップ。<br>
ショートカットAppが開いたら「ショートカットを追加」を押してね。
</p>

<a class="btn sub" href="./downloads/HarborDesk-Capture.shortcut" download="HarborDesk-Capture.shortcut">うまく保存できない時の直接リンク</a>
</div>
</main>

<script>
const status=document.getElementById('status');
async function saveShortcut(file,name){
  status.style.display='block';
  status.textContent='ファイルを準備中…';
  try{
    const res=await fetch(file,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const blob=await res.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
    status.textContent='保存処理を開始したよ。\nSafariの「↓」または「ファイル」App → ダウンロードを確認してね。';
  }catch(e){
    status.textContent='自動保存できなかったよ。下の「直接リンク」を長押しして「リンク先のファイルをダウンロード」を選んでね。\n'+String(e&&e.message||e);
  }
}
document.getElementById('downloadMain').onclick=()=>saveShortcut('./downloads/HarborDesk-Capture.shortcut','HarborDesk-Capture.shortcut');
document.getElementById('downloadTest').onclick=()=>saveShortcut('./downloads/HarborDesk-Test.shortcut','HarborDesk-Test.shortcut');
</script>
</body>
</html>
