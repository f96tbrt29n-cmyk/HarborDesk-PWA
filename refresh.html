<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1b2b">
  <title>HarborDesk 更新リセット</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111c;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
    main{width:min(520px,calc(100vw - 32px));padding:24px;border:1px solid #294966;border-radius:18px;background:#0c2032}
    h1{margin:0 0 12px;font-size:24px}p{color:#b5c9d9;line-height:1.7}button{width:100%;padding:14px;border:0;border-radius:12px;background:#75c8ff;color:#052033;font-weight:800;font-size:16px}
  </style>
</head>
<body>
<main>
  <h1>HarborDeskを最新状態に更新中</h1>
  <p id="status">古いアプリキャッシュだけを整理しています。艦隊台帳・装備台帳などの端末内データは消しません。</p>
  <button id="retry" type="button" hidden>もう一度更新する</button>
</main>
<script>
(() => {
  const BUILD=452;
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');
  async function run(){
    retry.hidden=true;
    status.textContent='古いアプリキャッシュだけを整理しています。艦隊台帳・装備台帳などの端末内データは消しません。';
    try{
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(r=>String(r.scope||'').includes('/HarborDesk-PWA/')).map(r=>r.unregister().catch(()=>false)));
      }
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k.startsWith('harbordesk-pwa-')).map(k=>caches.delete(k)));
      }
      const url=new URL('./',location.href);
      url.searchParams.set('hd_rescue',String(BUILD));
      url.searchParams.set('_',Date.now().toString());
      location.replace(url.toString());
    }catch(err){
      status.textContent='自動更新に失敗しました。通信を確認して、もう一度押してね。';
      retry.hidden=false;
    }
  }
  retry.addEventListener('click',run);
  run();
})();
</script>
</body>
</html>
